[package]
name = "tracon-desktop"
description = "Tracon: the flight recorder for AI coding agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# The `_lib` suffix avoids a bin/lib name clash on Windows.
name = "tracon_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracon-core = { path = "../../../crates/tracon-core" }
tracon-ingest = { path = "../../../crates/tracon-ingest" }
tauri-plugin-notification = "2"
